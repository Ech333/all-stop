name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Pure standard library by design (pyproject.toml: dependencies = []) - no pip install step
    # needed. `python -m unittest discover` resolves the package correctly from the checked-out
    # repo root alone, the same way this suite has already been run and verified locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python -m unittest discover -s tests -v
