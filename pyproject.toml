[project]
name = "all-stop"
version = "0.1.0"
description = "A self-hosted, file-backed kill switch and webhook broadcast for stopping agent tooling org-wide."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
all-stop = "all_stop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["all_stop*"]
